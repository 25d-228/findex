name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web preference save validation
        working-directory: web
        run: |
          ./node_modules/.bin/tsc \
            --ignoreConfig \
            --target es2023 \
            --module commonjs \
            --rootDir . \
            --outDir "$RUNNER_TEMP/PreferenceSaveTests" \
            --skipLibCheck \
            src/lib/preferenceDefaults.ts \
            src/lib/preferenceSave.ts \
            tests/PreferenceSaveTests.ts
          node "$RUNNER_TEMP/PreferenceSaveTests/tests/PreferenceSaveTests.js"

      - name: Test Finder preview ordering
        working-directory: web
        run: |
          ./node_modules/.bin/tsc \
            --ignoreConfig \
            --target es2023 \
            --module commonjs \
            --rootDir . \
            --outDir "$RUNNER_TEMP/PreviewOrderTests" \
            --skipLibCheck \
            src/lib/previewOrder.ts \
            tests/PreviewOrderTests.ts
          node "$RUNNER_TEMP/PreviewOrderTests/tests/PreviewOrderTests.js"

      - name: Lint web application
        working-directory: web
        run: npm run lint

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Test Finder view-preset script generation
        run: |
          swiftc \
            -swift-version 5 \
            -target "$(uname -m)-apple-macosx13.0" \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -framework AppKit \
            Sources/FindexApp/FindexPreferences.swift \
            Sources/FindexApp/FinderViewPresetScript.swift \
            Tests/FinderViewPresetScriptTests.swift \
            -o "$RUNNER_TEMP/FinderViewPresetScriptTests"
          "$RUNNER_TEMP/FinderViewPresetScriptTests"

      - name: Test web preferences bridge ownership
        run: |
          swiftc \
            -swift-version 5 \
            -target "$(uname -m)-apple-macosx13.0" \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -framework WebKit \
            Sources/FindexApp/WeakScriptMessageHandler.swift \
            Tests/WeakScriptMessageHandlerTests.swift \
            -o "$RUNNER_TEMP/WeakScriptMessageHandlerTests"
          "$RUNNER_TEMP/WeakScriptMessageHandlerTests"

      - name: Test native preference save validation
        run: |
          swiftc \
            -swift-version 5 \
            -target "$(uname -m)-apple-macosx13.0" \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -framework AppKit \
            Sources/FindexApp/FindexPreferences.swift \
            Sources/FindexApp/PreferenceSaveMessage.swift \
            Tests/PreferenceSaveMessageTests.swift \
            -o "$RUNNER_TEMP/PreferenceSaveMessageTests"
          "$RUNNER_TEMP/PreferenceSaveMessageTests"

      - name: Build macOS application
        run: scripts/build-local.sh

      - name: Test release archive metadata
        run: Tests/PackageReleaseTests.sh
