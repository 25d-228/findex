name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint web application
        working-directory: web
        run: npm run lint

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Test Finder view-preset script generation
        run: |
          swiftc \
            -swift-version 5 \
            -target "$(uname -m)-apple-macosx13.0" \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -framework AppKit \
            Sources/FindexApp/FindexPreferences.swift \
            Sources/FindexApp/FinderViewPresetScript.swift \
            Tests/FinderViewPresetScriptTests.swift \
            -o "$RUNNER_TEMP/FinderViewPresetScriptTests"
          "$RUNNER_TEMP/FinderViewPresetScriptTests"

      - name: Test web preferences bridge ownership
        run: |
          swiftc \
            -swift-version 5 \
            -target "$(uname -m)-apple-macosx13.0" \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -framework WebKit \
            Sources/FindexApp/WeakScriptMessageHandler.swift \
            Tests/WeakScriptMessageHandlerTests.swift \
            -o "$RUNNER_TEMP/WeakScriptMessageHandlerTests"
          "$RUNNER_TEMP/WeakScriptMessageHandlerTests"

      - name: Build macOS application
        run: scripts/build-local.sh
